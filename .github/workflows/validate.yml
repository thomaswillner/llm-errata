name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No dependencies are installed on purpose. Every checker is stdlib-only,
      # so a green run here cannot be an artefact of the toolchain.
      - name: Lint repository structure and metadata
        run: make lint

      - name: Guard the bounded claim
        run: make claim

      - name: Validate production-readiness evidence
        run: make readiness

      - name: Validate active publication surfaces
        run: make publication

      - name: Run self-tests, including the negative cases
        run: make test
