name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: ${{ matrix.python-version }}

      # No dependencies are installed on purpose. Every checker is stdlib-only,
      # so a green run here cannot be an artefact of the toolchain.
      - name: Lint repository structure and metadata
        run: make lint

      - name: Guard the bounded claim
        run: make claim

      - name: Validate production-readiness evidence
        run: make readiness

      - name: Validate active publication surfaces
        run: make publication

      - name: Run self-tests, including the negative cases
        run: make test
